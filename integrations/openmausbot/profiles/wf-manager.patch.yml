# New independent role profile. Thinking is selected by the Bot ACP task setting.
- id: acp
  config:
    provider: workbuddy
    model: deepseek-v4.1-flash
- id: llm-deepseek-account
  disabled: true
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - /Users/a1/Documents/a/workflour/agents/wf-manager/skills
- id: system-prompt
  config:
    personaPrefix: "You are 大管家. Read /Users/a1/Documents/a/workflour/agents/wf-manager/SOUL.md for your role and /Users/a1/Documents/a/workflour/agents/wf-manager/SKILLS.md for on-demand skills. Preserve this role when changing models."
- id: permission
  config:
    defaultPreset: danger-full-access
