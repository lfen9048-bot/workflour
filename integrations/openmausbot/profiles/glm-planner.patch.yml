# DSH role; WorkBuddy is the provider/credit plugin, not an Agent runtime.
- id: acp
  config:
    provider: workbuddy
    model: glm-5.3
- id: llm-deepseek-account
  disabled: true
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - /Users/a1/Documents/a/workflour/agents/glm-planner/skills
- id: system-prompt
  config:
    personaPrefix: "Independently assess the task and proposed plan for missing requirements, risks, interfaces and testability. Provide evidence and concrete alternatives. Do not implement business code."

# Owner authorized Full access for the formal team on 2026-11-10.
- id: permission
  config:
    defaultPreset: danger-full-access
