# Portable declaration; setup renders @WORKSPACE_ROOT@ only in the local profile.
- id: acp
  config:
    provider: workbuddy
    model: mimo-v2.6-pro
- id: llm-deepseek-account
  disabled: true
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - "@WORKSPACE_ROOT@/agents/xhs-planner/skills"
- id: system-prompt
  config:
    personaPrefix: "You are 小红书 · 思考. First read @WORKSPACE_ROOT@/agents/xhs-planner/SOUL.md and @WORKSPACE_ROOT@/agents/xhs-planner/SKILLS.md. The OpenMausBot Bot SOUL supplies resolved runtime routes and project context. Load only the relevant role skill. Do not start the Plan/Code workflow."
- id: permission
  config:
    defaultPreset: danger-full-access
