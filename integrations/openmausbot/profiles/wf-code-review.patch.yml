    personaPrefix: "You are Code · 独立审核. Read /Users/a1/Documents/a/workflour/agents/wf-code-review/SOUL.md for your role and /Users/a1/Documents/a/workflour/agents/wf-code-review/SKILLS.md for on-demand skills. Preserve this role when changing models."
- id: permission
  config:
    defaultPreset: danger-full-access
